name: CI

on:
  push:
    branches: [main]
    paths:
      - 'migrate.py'
      - 'migrate.sh'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.8', '3.11', '3.12']
        exclude:
          # Python 3.8 not available on macOS arm64 runners
          - os: macos-latest
            python: '3.8'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile migrate.py

      - name: Verify --version
        run: python migrate.py --version

      - name: Verify --help
        run: python migrate.py --help

      - name: Verify all classes import
        run: |
          python -c "from migrate import Config, PortainerClient, ArcaneClient, DockerLocal, WizardUI, ReportGenerator, MigrationEngine; print('All 7 classes import OK')"

      - name: Verify launcher (Unix only)
        if: runner.os != 'Windows'
        run: |
          chmod +x migrate.sh
          ./migrate.sh --help
          ./migrate.sh --check-only
