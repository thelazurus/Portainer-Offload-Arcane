name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.1)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify syntax
        run: python -m py_compile migrate.py

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.inputs.tag }}"; fi
          VERSION=$(python migrate.py --version | awk '{print $NF}')
          EXPECTED="${TAG#v}"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::Version mismatch: tag=$TAG (expected $EXPECTED) but migrate.py reports $VERSION"
            exit 1
          fi
          echo "Version $VERSION matches tag $TAG ✓"

      - name: Verify --help
        run: python migrate.py --help

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.inputs.tag }}"; fi
          VERSION="${TAG#v}"
          # Pull the section between the version header and the next ## heading
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## What's in this release

            ${{ steps.changelog.outputs.notes }}

            ---

            ## Installation

            ```bash
            curl -O https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/migrate.sh
            curl -O https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/migrate.py
            curl -O https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/requirements.txt
            chmod +x migrate.sh
            ./migrate.sh
            ```

            See the [README](https://github.com/${{ github.repository }}#readme) for full usage.
          files: |
            migrate.py
            migrate.sh
            requirements.txt
            README.md
            CHANGELOG.md
            LICENSE
          fail_on_unmatched_files: false
